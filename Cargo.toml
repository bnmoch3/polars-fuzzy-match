[package]
name = "polars_fuzzy_match"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"

[lib]
name = "polars_fuzzy_match"
crate-type = ["cdylib"]

[dependencies]
nucleo = "0.4.0"
nucleo-matcher = "0.3.1"
polars = "0.37"
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
pyo3-polars = { version = "0.11", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
