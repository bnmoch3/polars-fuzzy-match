[package]
name = "polars_fuzzy_match"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"

[lib]
name = "polars_fuzzy_match"
crate-type = ["cdylib"]

[dependencies]
nucleo = "0.5.0"
nucleo-matcher = "0.3.1"
polars = { version = "0.55.1", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
pyo3-polars = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
